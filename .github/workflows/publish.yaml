name: Publish to NuGet

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    environment: nuget
    env:
      SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore MinecraftRenderer
      
    - name: Build
      run: dotnet build --no-restore MinecraftRenderer -c Release
      
    - name: Publish
      run: dotnet nuget push MinecraftRenderer/bin/Release/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
